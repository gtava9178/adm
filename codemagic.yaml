workflows:
  android-workflow:
    name: Android Build
    max_build_duration: 60
    scripts:
      - name: Build debug APK
        script: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --stacktrace
          else
            gradle assembleDebug --stacktrace
          fi
    artifacts:
      - "**/*.apk"
