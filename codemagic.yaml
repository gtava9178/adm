workflows:
  android-workflow:
    name: Android Build
    max_build_duration: 60
    scripts:
      - name: Build debug APK
        script: |
          GRADLE_VER=9.3.1
          curl -fsSL "https://services.gradle.org/distributions/gradle-${GRADLE_VER}-bin.zip" -o gradle.zip
          unzip -q gradle.zip -d /tmp/gradle-custom
          export GRADLE_HOME="/tmp/gradle-custom/gradle-${GRADLE_VER}"
          export PATH="$GRADLE_HOME/bin:$PATH"
          gradle assembleDebug --console=plain --stacktrace
    artifacts:
      - "**/*.apk"
