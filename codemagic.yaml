workflows:
  android-debug:
    name: Build Android Debug APK
    max_build_duration: 60
    environment:
      java: 17
    scripts:
      - name: Grant permission to gradlew
        chmod +x gradlew
      - name: Build Debug APK
        ./gradlew assembleDebug
    artifacts:
      - app/build/outputs/apk/debug/*.apk
